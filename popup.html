<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Match no Vagas.com</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilo personalizado -->
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container py-3">
    <h3 class="text-center mb-3">Match no Vagas.com</h3>
    
    <div class="mb-3">
      <textarea id="keywordsTitle" class="form-control" rows="2" placeholder="Palavras-chave para o título (separadas por vírgula)"></textarea>
    </div>

    <div class="mb-3">
      <textarea id="keywordsDesc" class="form-control" rows="2" placeholder="Palavras-chave para a descrição (separadas por vírgula)"></textarea>
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="saveAll">
      <label class="form-check-label" for="saveAll">
        Salvar todas as vagas mesmo sem palavras-chave
      </label>
    </div>

    <div class="d-grid gap-2">
      <button id="startBtn" class="btn btn-primary">Iniciar Coleta</button>
      <button id="stopBtn" class="btn btn-danger" style="display:none;">Cancelar e Salvar</button>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
